name: Validate and build DigiTalks
on:
  push:
    branches: [main, develop, 'design/**', 'strategy/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: digitalks-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: digitalks-static-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          retention-days: 14
