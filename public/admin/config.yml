# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: mario-sound/digitalks-ai-astroweb
  branch: main

media_folder: public/media
public_folder: /media

output:
  omit_empty_optional_fields: true

collections:
  - name: pages
    label: Paginas
    label_singular: Pagina
    folder: content/pages
    format: json
    extension: json
    create: true
    delete: true
    identifier_field: id
    summary: "{{title}} · {{lang}}"
    table_columns: [id, title, path, lang]
    preview_path: "{{fields.path}}"
    slug: "{{fields.id}}"
    fields:
      - { name: id, label: ID, widget: string }
      - { name: title, label: Titulo, widget: string }
      - { name: path, label: Ruta, widget: string }
      - { name: lang, label: Idioma, widget: select, options: { values: [es, en] } }
      - { name: seo, label: ID SEO, widget: string }
      - { name: design, label: Diseno, widget: hidden, required: false }
      - { name: commercial, label: Comercial, widget: hidden, required: false }
      - name: sections
        label: Secciones
        widget: list
        required: false
        collapsed: false
        fields:
          - { name: type, label: Tipo, widget: string, required: false }
          - { name: id, label: ID, widget: string, required: false }
          - { name: kind, label: Tipo comercial, widget: select, required: false, options: { values: [content, hero, sectors, demos, services, process, contact, workflow, suiteqa, languages, specs, experience] } }
          - { name: enabled, label: Visible, widget: boolean, required: false }
          - { name: surface, label: Fondo, widget: select, required: false, options: { values: [light, soft, dark, brand] } }
          - { name: eyebrow, label: Etiqueta, widget: string, required: false }
          - { name: heading, label: Titular, widget: string, required: false }
          - { name: headingAccent, label: Parte destacada del titular, widget: string, required: false }
          - { name: body, label: Texto, widget: text, required: false }
          - { name: image, label: Imagen, widget: image, required: false, media_folder: public/media, public_folder: /media }
          - { name: alt, label: Texto alternativo, widget: string, required: false }
          - { name: caption, label: Pie, widget: string, required: false }
          - { name: galleryLabel, label: Etiqueta galeria, widget: string, required: false }
          - { name: fitLabel, label: Ajustar, widget: string, required: false }
          - { name: zoomLabel, label: Ampliar, widget: string, required: false }
          - { name: closeLabel, label: Cerrar, widget: string, required: false }
          - { name: developmentLabel, label: En desarrollo, widget: string, required: false }
          - { name: originalSizeLabel, label: Tamano original, widget: string, required: false }
          - { name: note, label: Nota, widget: text, required: false }
          - { name: stat, label: Cifra, widget: string, required: false }
          - { name: statLabel, label: Etiqueta cifra, widget: string, required: false }
          - { name: characterLabel, label: Etiqueta personajes, widget: string, required: false }
          - { name: multilingualLabel, label: Etiqueta multilingue, widget: string, required: false }
          - { name: form, label: ID formulario, widget: string, required: false }
          - { name: email, label: Email, widget: string, required: false }
          - name: items
            label: Tarjetas
            widget: list
            required: false
            fields:
              - { name: title, label: Titulo, widget: string, required: false }
              - { name: body, label: Texto, widget: text, required: false }
          - name: heroMetrics
            label: Metricas
            widget: list
            required: false
            fields:
              - { name: title, label: Titulo, widget: string, required: false }
              - { name: body, label: Texto, widget: string, required: false }
          - name: timeline
            label: Cronologia
            widget: list
            required: false
            fields:
              - { name: title, label: Titulo, widget: string, required: false }
              - { name: body, label: Texto, widget: text, required: false }
          - name: actions
            label: Botones
            widget: list
            required: false
            fields:
              - { name: label, label: Texto, widget: string, required: false }
              - { name: href, label: Enlace, widget: string, required: false }
          - name: screenshots
            label: Capturas
            widget: list
            required: false
            fields:
              - { name: id, label: ID, widget: string, required: false }
              - { name: src, label: Imagen, widget: image, required: false, media_folder: public/images/suiteqa, public_folder: /images/suiteqa, accept: .webp,.avif,.png,.jpg }
              - { name: title, label: Titulo, widget: string, required: false }
              - { name: alt, label: Texto alternativo, widget: string, required: false }
              - { name: caption, label: Pie, widget: text, required: false }
              - { name: status, label: Estado, widget: select, required: false, options: { values: [internal, development] } }
              - { name: review, label: Revision, widget: select, required: false, options: { values: [pending, approved] } }
              - { name: enabled, label: Visible, widget: boolean, required: false }

  - name: services
    label: Servicios
    folder: content/services
    format: json
    extension: json
    create: true
    identifier_field: id
    summary: "{{title}} · {{lang}}"
    preview_path: "{{fields.path}}"
    slug: "{{fields.id}}"
    fields:
      - { name: id, label: ID }
      - { name: title, label: Titulo }
      - { name: path, label: Ruta }
      - { name: lang, label: Idioma, widget: select, options: { values: [es, en] } }
      - { name: seo, label: ID SEO }
      - { name: design, label: Diseno, widget: hidden, required: false }
      - { name: commercial, label: Comercial, widget: hidden, required: false }
      - name: sections
        label: Secciones
        widget: list
        required: false
        fields:
          - { name: type, widget: string, required: false }
          - { name: id, label: ID, required: false }
          - { name: kind, widget: select, required: false, options: { values: [content, hero, sectors, demos, services, process, contact, workflow, suiteqa, languages, specs, experience] } }
          - { name: enabled, label: Visible, widget: boolean, required: false }
          - { name: surface, widget: select, required: false, options: { values: [light, soft, dark, brand] } }
          - { name: eyebrow, required: false }
          - { name: heading, label: Titular, required: false }
          - { name: headingAccent, label: Parte destacada, required: false }
          - { name: body, widget: text, required: false }
          - { name: image, widget: image, required: false, media_folder: public/media, public_folder: /media }
          - { name: alt, required: false }
          - { name: caption, required: false }
          - { name: note, widget: text, required: false }
          - { name: galleryLabel, required: false }
          - { name: fitLabel, required: false }
          - { name: zoomLabel, required: false }
          - { name: closeLabel, required: false }
          - { name: developmentLabel, required: false }
          - { name: originalSizeLabel, required: false }
          - name: items
            widget: list
            required: false
            fields:
              - { name: title, required: false }
              - { name: body, widget: text, required: false }
          - name: heroMetrics
            widget: list
            required: false
            fields:
              - { name: title, required: false }
              - { name: body, required: false }
          - name: timeline
            widget: list
            required: false
            fields:
              - { name: title, required: false }
              - { name: body, widget: text, required: false }
          - name: actions
            widget: list
            required: false
            fields:
              - { name: label, required: false }
              - { name: href, required: false }
          - name: screenshots
            label: Capturas
            widget: list
            required: false
            fields:
              - { name: id, required: false }
              - { name: src, widget: image, required: false, media_folder: public/images/suiteqa, public_folder: /images/suiteqa }
              - { name: title, required: false }
              - { name: alt, required: false }
              - { name: caption, widget: text, required: false }
              - { name: status, widget: select, required: false, options: { values: [internal, development] } }
              - { name: review, widget: select, required: false, options: { values: [pending, approved] } }
              - { name: enabled, widget: boolean, required: false }

  - name: demos
    label: Demos
    folder: content/demos
    format: json
    extension: json
    identifier_field: id
    summary: "{{title}} · {{language}}"
    fields:
      - { name: id, label: ID }
      - { name: title, label: Titulo }
      - { name: character, label: Personaje }
      - { name: language, label: Idioma }
      - { name: audio, label: Audio, widget: file, media_folder: public/media, public_folder: /media, accept: .mp3,.wav,.ogg }
      - { name: image, label: Imagen, widget: image, required: false, media_folder: public/media, public_folder: /media }
      - { name: flag, label: Bandera, widget: image, required: false, media_folder: public/media, public_folder: /media }
      - { name: order, label: Orden, widget: number, required: false }
      - { name: source, widget: hidden, required: false }

  - name: characters
    label: Personajes
    folder: content/characters
    format: json
    extension: json
    identifier_field: id
    fields:
      - { name: id, label: ID }
      - { name: title, label: Titulo }
      - { name: image, label: Imagen, widget: image, media_folder: public/media, public_folder: /media }

  - name: languages
    label: Idiomas
    folder: content/languages
    format: json
    extension: json
    identifier_field: id
    fields:
      - { name: id, label: ID }
      - { name: title, label: Nombre }
      - { name: home, label: Home }
      - { name: formError, label: Error de formulario, widget: text, required: false }

  - name: seo
    label: SEO
    folder: content/seo
    format: json
    extension: json
    identifier_field: id
    fields:
      - { name: id, label: ID }
      - { name: title, label: Title }
      - { name: description, label: Descripcion, widget: text }
      - { name: canonical, label: Canonical }
      - name: alternates
        label: Alternativas
        widget: list
        required: false
        fields:
          - { name: lang, label: Idioma }
          - { name: path, label: Ruta }
      - { name: image, label: Imagen OG, widget: image, required: false, media_folder: public/media, public_folder: /media }

  - name: forms
    label: Formularios
    folder: content/forms
    format: json
    extension: json
    identifier_field: id
    fields:
      - { name: id, label: ID }
      - { name: title, label: Titulo }
      - { name: lang, label: Idioma, widget: select, options: { values: [es, en] } }
      - { name: source, widget: hidden, required: false }
      - name: fields
        label: Campos
        widget: list
        required: false
        fields:
          - { name: name, label: Nombre }
          - { name: label, label: Etiqueta }
          - { name: type, widget: select, options: { values: [text, email, tel, textarea, select, checkbox, url, number, date, heading] } }
          - { name: showLabel, widget: boolean, required: false }
          - { name: width, widget: select, required: false, options: { values: [full, half] } }
          - { name: required, widget: boolean, required: false }
          - { name: placeholder, required: false }
          - name: options
            widget: list
            required: false
            fields:
              - { name: label, required: false }
              - { name: value, required: false }
      - { name: submit, label: Boton enviar }
      - { name: status, widget: select, options: { values: [unconfigured, configured] } }
      - { name: senderFormId, label: ID publico Sender, required: false }
      - { name: notice, widget: text, required: false }
      - { name: compact, widget: boolean, required: false }
      - { name: optionalLabel, required: false }
      - { name: privacyText, widget: text, required: false }
      - { name: privacyLabel, required: false }
      - { name: privacySummary, required: false }
      - { name: statusLabel, required: false }
      - { name: emailError, required: false }

  - name: legal
    label: Contenido legal
    folder: content/legal
    format: json
    extension: json
    identifier_field: id
    fields:
      - { name: id, label: ID }
      - { name: title, label: Titulo }
      - { name: path, label: Ruta }
      - { name: lang, widget: select, options: { values: [es, en] } }
      - { name: seo, label: ID SEO }
      - name: sections
        label: Secciones
        widget: list
        required: false
        fields:
          - { name: type, widget: string, required: false }
          - { name: id, required: false }
          - { name: enabled, widget: boolean, required: false }
          - { name: heading, required: false }
          - { name: body, widget: text, required: false }
          - { name: image, widget: image, required: false }
          - { name: alt, required: false }

  - name: settings
    label: Configuracion
    files:
      - name: navigation
        label: Navegacion
        file: content/settings/navigation.json
        fields:
          - name: es
            label: Espanol
            widget: list
            fields:
              - { name: label, label: Texto }
              - { name: href, label: Enlace }
          - name: en
            label: Ingles
            widget: list
            fields:
              - { name: label, label: Texto }
              - { name: href, label: Enlace }
      - name: general
        label: Configuracion general
        file: content/settings/general.json
        fields:
          - { name: title, label: Titulo }
          - { name: url, label: URL }
          - { name: logo, label: Logo, widget: image, media_folder: public/media, public_folder: /media }
          - { name: preview, label: Bloquear indexacion, widget: boolean }
          - { name: senderAccountId, label: ID publico Sender, required: false }
          - { name: senderEnabled, label: Sender activo, widget: boolean }
          - { name: gtmId, label: GTM, required: false }
          - { name: analyticsEnabled, label: Analitica activa, widget: boolean }
          - { name: searchConsoleVerification, label: Verificacion Search Console, required: false }
      - name: footer
        label: Pie de pagina
        file: content/settings/footer.json
        fields:
          - name: es
            label: Espanol
            widget: object
            fields:
              - { name: copyright }
              - { name: credit }
              - { name: email }
              - name: links
                widget: list
                fields:
                  - { name: label }
                  - { name: href }
          - name: en
            label: Ingles
            widget: object
            fields:
              - { name: copyright }
              - { name: credit }
              - { name: email }
              - name: links
                widget: list
                fields:
                  - { name: label }
                  - { name: href }
      - name: ui
        label: Interfaz y consentimiento
        file: content/settings/ui.json
        fields:
          - name: es
            label: Espanol
            widget: object
            fields:
              - { name: skip, widget: text }
              - { name: menu, widget: text }
              - { name: navigation, widget: text }
              - { name: legal, widget: text }
              - { name: consentTitle, widget: text }
              - { name: consentText, widget: text }
              - { name: necessary, widget: text }
              - { name: optional, widget: text }
              - { name: privacy, widget: text }
              - { name: audioPlay, widget: text }
              - { name: audioPause, widget: text }
              - { name: audioSeek, widget: text }
              - { name: audioMute, widget: text }
          - name: en
            label: Ingles
            widget: object
            fields:
              - { name: skip, widget: text }
              - { name: menu, widget: text }
              - { name: navigation, widget: text }
              - { name: legal, widget: text }
              - { name: consentTitle, widget: text }
              - { name: consentText, widget: text }
              - { name: necessary, widget: text }
              - { name: optional, widget: text }
              - { name: privacy, widget: text }
              - { name: audioPlay, widget: text }
              - { name: audioPause, widget: text }
              - { name: audioSeek, widget: text }
              - { name: audioMute, widget: text }
